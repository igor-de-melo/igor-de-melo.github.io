# Roda os testes do site a cada push e pull request. Resultado na aba "Actions" do GitHub.
name: Site checks

on:
  push:
  pull_request:
  workflow_dispatch:

# Permissão mínima do token: o workflow só lê o repositório.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Language parity (PT/EN/FR)
        run: node tests/check-parity.mjs
      - name: Q-learning maze
        run: node tests/check-maze.mjs
      - name: Malware spread model (SIR)
        run: node tests/check-malware.mjs
      # Diagnóstico: versão do navegador usado pelos três testes seguintes (tests/lib/cdp.mjs).
      - name: Chrome version
        run: google-chrome --version || google-chrome-stable --version || chromium-browser --version || chromium --version || echo "Chrome/Chromium not found in PATH"
      - name: Views (Simple / Themed)
        run: node tests/check-views.mjs
      - name: Figure lightbox
        run: node tests/check-lightbox.mjs
      # A paginação depende das fontes instaladas no sistema e pode diferir do ambiente local:
      # este passo avisa, mas não bloqueia.
      - name: Printed pages (warning only)
        run: node tests/check-print.mjs
        continue-on-error: true
      - name: Internal links
        run: node tests/check-links.mjs
      - name: External links (warning only)
        run: node tests/check-links.mjs --external
        continue-on-error: true
